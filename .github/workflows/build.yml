name: Build AtlantykaWagons

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AtlantykaWagons-1.1.0
          path: target/AtlantykaWagons-1.1.0.jar
          if-no-files-found: error
